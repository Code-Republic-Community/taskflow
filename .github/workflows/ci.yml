name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job ids "server" and "client" are required status checks on main: do not rename them.
  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache MongoDB binary for mongodb-memory-server
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint server
        run: npm run lint -w server

      - name: Type-check server
        run: npm run typecheck -w server

      - name: Test server
        run: npm run test -w server

  client:
    name: client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint -w client

      - name: Type-check client
        run: npm run typecheck -w client

      - name: Test client
        run: npm run test -w client

      - name: Build client
        run: npm run build -w client
